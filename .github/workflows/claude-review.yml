# Claude PR review: the caller. The review itself is the reusable workflow claude-review-kit.yml (ADR 0013, ADR 0018;
# the kit's README is tools/claude-review/README.md). This file owns the triggers, the permission ceiling and the
# secrets the kit may use. Every kit job narrows the ceiling with its own `permissions:`.
#
# This repo calls its own copy by a local path, so a PR that edits the kit is reviewed by its own edited copy. Any
# other repo calls the kit's main instead:
#   uses: <owner>/ai-toolkit/.github/workflows/claude-review-kit.yml@main
#
# Secrets are mapped by name, never `secrets: inherit`: the kit gets the reviewer App's key and the Claude credential
# and nothing else. Never add another secret here.

name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    permissions:
      contents: write
      pull-requests: write
      issues: read
    uses: ./.github/workflows/claude-review-kit.yml
    secrets:
      CLAUDE_REVIEW_APP_KEY: ${{ secrets.CLAUDE_REVIEW_APP_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
