# The checks a PR must not break. No secrets and read-only, so it is safe on a fork's PR.
# Install Checks: hooks run by their path, so a hook committed without the executable bit fails open.
# test-install-copies.sh fails on one, and on the install status lines that report it. A required check in the main
# ruleset, by this job name.
# Tool Checks: every suite in tools/test-all.sh except the slow, timing-based workspace-lock-wait. Not required yet.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: Install Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run the install-copies tests
        run: bash tools/test-install-copies.sh

  tools:
    name: Tool Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Run the test suites
        run: bash tools/test-all.sh --quick
